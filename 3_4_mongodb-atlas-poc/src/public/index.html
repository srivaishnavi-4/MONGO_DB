
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB User Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 480px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        .users-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>User Registration</h2>

        <p class="description">
            Enter your details to save a user in MongoDB.
        </p>

        <form id="userForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="1"
                placeholder="Enter your age"
                required
            >

            <label for="city">City</label>
            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >

            <button type="submit">Register User</button>

        </form>

        <p id="message"></p>

        <a class="users-link" href="/api/users" target="_blank">
            View All Registered Users
        </a>

    </div>

    <script>
        const userForm = document.getElementById("userForm");
        const message = document.getElementById("message");

        userForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData(userForm);

            const user = {
                name: formData.get("name"),
                email: formData.get("email"),
                age: formData.get("age"),
                city: formData.get("city")
            };

            try {
                const response = await fetch("/api/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(user)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message);
                }

                message.style.color = "green";
                message.textContent = result.message;

                userForm.reset();

                console.log("Inserted user:", result.user);

            } catch (error) {
                message.style.color = "red";
                message.textContent = error.message;
            }
        });
    </script>

</body>
</html>
